<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Icône OJD : horizon bleu (comme le fond GradientASCII) sur fond noir -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="0%" r="95%">
      <stop offset="0" stop-color="#f6f8ff"/>
      <stop offset="0.35" stop-color="#a5d8ff"/>
      <stop offset="0.6" stop-color="#38bdf8"/>
      <stop offset="0.85" stop-color="#1e3fd8"/>
      <stop offset="1" stop-color="#1e3fd8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="#000"/>
    <rect width="256" height="190" fill="url(#sky)"/>
    <ellipse cx="128" cy="300" rx="190" ry="140" fill="#000"/>
    <g fill="#a5d8ff" opacity="0.55" font-family="monospace" font-size="18" font-weight="700">
      <text x="24" y="44">x X 0 S 8 # @ 8 S 0</text>
      <text x="24" y="70">+ x X 0 S 8 8 S 0 X</text>
      <text x="24" y="96">= + x X 0 0 X x + =</text>
    </g>
    <text x="128" y="214" text-anchor="middle" fill="#f5f5f5" font-family="sans-serif" font-size="58" font-weight="800" letter-spacing="6">OJD</text>
  </g>
</svg>
